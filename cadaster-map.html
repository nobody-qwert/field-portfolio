<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadaster Fields Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ4NJPaUu9ONlSNXQIFJx6T1xqmDkCk="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #617080;
      --line: #d4dbe3;
      --parcel: #111827;
      --point: #f7f9fc;
      --point-stroke: #0f172a;
      --accent: #0f766e;
      --accent-soft: #d9f3ee;
      --surface: #ffffff;
      --page: #eef2f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    header {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title-tools {
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      gap: 12px;
      min-width: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 12px;
      min-width: 0;
    }

    .stats {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .stat {
      display: grid;
      gap: 3px;
      min-width: 116px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .layout {
      display: contents;
    }

    .map-wrap {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    #map {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      min-height: 0;
      flex: 1 1 auto;
      border: 0;
      border-radius: 0;
      background: #d9e2ea;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      outline-offset: 1px;
      touch-action: pan-x pan-y;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      visibility: hidden;
    }

    .leaflet-tile-loaded {
      visibility: inherit;
    }

    .leaflet-pane {
      z-index: 400;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-shadow-pane {
      z-index: 500;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-popup-pane {
      z-index: 700;
    }

    .leaflet-map-pane svg {
      z-index: 200;
    }

    .leaflet-map-pane canvas {
      z-index: 100;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      clear: both;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-bottom {
      bottom: 0;
    }

    .leaflet-left {
      left: 0;
    }

    .leaflet-left .leaflet-control {
      float: left;
      margin-left: 10px;
    }

    .leaflet-right .leaflet-control {
      float: right;
      margin-right: 10px;
    }

    .leaflet-top .leaflet-control {
      margin-top: 10px;
    }

    .leaflet-bottom .leaflet-control {
      margin-bottom: 10px;
    }

    .leaflet-control-zoom a {
      display: block;
      width: 30px;
      height: 30px;
      border-bottom: 1px solid #c8d0d8;
      color: #111827;
      background: #fff;
      font: bold 18px/30px Arial, Helvetica, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 4px 4px 0 0;
    }

    .leaflet-control-zoom a:last-child {
      border-bottom: 0;
      border-radius: 0 0 4px 4px;
    }

    .leaflet-interactive {
      cursor: pointer;
    }

    .leaflet-tooltip {
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
    }

    .point-label {
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      text-shadow:
        -1px -1px 0 #fff,
        1px -1px 0 #fff,
        -1px 1px 0 #fff,
        1px 1px 0 #fff;
    }

    .parcel-name {
      color: rgb(255 255 255 / 0.92);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 5px rgb(0 0 0 / 0.85);
    }

    .leaflet-tooltip.point-tooltip {
      min-width: 148px;
      border: 1px solid rgb(255 255 255 / 0.72);
      border-radius: 6px;
      box-shadow: 0 14px 30px rgb(0 0 0 / 0.42);
      color: #f8fafc;
      background: rgb(2 6 23 / 0.94);
      font-size: 12px;
      line-height: 1.4;
      padding: 8px 10px;
      text-shadow: none;
    }

    .leaflet-tooltip.point-tooltip strong {
      display: block;
      margin-bottom: 3px;
      color: #ffffff;
      font-size: 13px;
    }

    .leaflet-tooltip-top.point-tooltip::before {
      border-top-color: rgb(2 6 23 / 0.94);
    }

    aside {
      grid-column: 2;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow: auto;
      min-height: 0;
      border-left: 1px solid var(--line);
      background: var(--surface);
    }

    .panel {
      padding: 16px 8px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.25;
    }

    .add-field-panel {
      margin-top: auto;
      padding-top: 12px;
      padding-bottom: 8px;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .add-coords-button,
    .copy-prompt {
      flex: 1 1 0;
      min-width: 0;
      min-height: 33px;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      padding: 7px 9px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .copy-prompt {
      color: var(--ink);
      background: #f8fafc;
    }

    .copy-prompt:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .prompt-box {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .import-row {
      display: grid;
      gap: 8px;
    }

    .paste-coordinate-form {
      display: grid;
      gap: 9px;
    }

    .coord-paste-box {
      width: 100%;
      min-height: 106px;
      max-height: 240px;
      resize: vertical;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--ink);
      font: 12px/1.45 Arial, Helvetica, sans-serif;
    }

    .paste-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .add-coords-button {
      border: 1px solid var(--accent);
      color: #ffffff;
      background: var(--accent);
    }

    .add-coords-button:disabled {
      border-color: var(--line);
      color: var(--muted);
      background: #e5e7eb;
      cursor: not-allowed;
    }

    .coord-paste-status[data-state="error"] {
      color: #b91c1c;
    }

    .coord-paste-status {
      flex-basis: 100%;
    }

    .coord-paste-status:empty {
      display: none;
    }

    .file-input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
    }

    .file-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .header-file-input {
      width: 210px;
      padding: 5px 7px;
      font-size: 12px;
    }

    .hint,
    .status {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status {
      min-height: 18px;
      color: var(--accent);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .header-setting {
      justify-content: flex-start;
      padding-left: 2px;
      white-space: nowrap;
    }

    .crs-control {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .header-select {
      min-width: 182px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-slider {
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #cbd5e1;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .switch-slider::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 3px rgb(15 23 42 / 0.2);
      content: "";
      transition: transform 160ms ease;
    }

    .switch input:checked + .switch-slider {
      border-color: var(--accent);
      background: var(--accent);
    }

    .switch input:checked + .switch-slider::before {
      transform: translateX(18px);
    }

    .switch input:focus-visible + .switch-slider {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .field-list {
      display: grid;
      gap: 8px;
    }

    .field-empty {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.45;
    }

    .field-empty strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      font-size: 13px;
    }

    .field-item {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .field-item input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .field-swatch {
      width: 10px;
      height: 28px;
      border-radius: 999px;
      background: var(--field-color);
    }

    .field-meta {
      display: grid;
      gap: 2px;
      min-width: 0;
      cursor: pointer;
    }

    .field-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-detail {
      color: var(--muted);
      font-size: 12px;
    }

    .field-remove {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .field-remove:hover {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fff5f5;
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      display: none;
      min-width: 176px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 12px 24px rgb(15 23 42 / 0.16);
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      main {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .title-tools {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }

      .header-controls {
        flex-wrap: wrap;
        width: 100%;
      }

      .header-file-input {
        width: min(240px, 100%);
      }

      .layout {
        display: block;
      }

      aside {
        height: auto;
        min-height: 0;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      #map {
        flex: none;
        height: 62vh;
        min-height: 420px;
      }

      .stats {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-tools">
        <div class="header-controls">
          <label class="file-control">
            <span>Import CSV</span>
            <input class="file-input header-file-input" id="csvInput" type="file" accept=".csv,text/csv">
          </label>
          <label class="crs-control">
            <span>CRS</span>
            <select class="header-select" id="crsSelect">
              <option value="EPSG:31700" selected>Stereo 70 - EPSG:31700</option>
              <option value="EPSG:3844">Stereo 70 - EPSG:3844</option>
            </select>
          </label>
          <label class="setting-row header-setting">
            <span>Satellite view</span>
            <span class="switch">
              <input id="satelliteToggle" type="checkbox" role="switch" aria-checked="true" checked>
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>
        </div>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat">
          <span>Area</span>
          <strong id="areaValue">-</strong>
        </div>
        <div class="stat">
          <span>Perimeter</span>
          <strong id="perimeterValue">-</strong>
        </div>
        <div class="stat">
          <span>Visible Fields</span>
          <strong id="fieldCount">-</strong>
        </div>
      </div>
    </header>

    <div class="layout">
      <section class="map-wrap" aria-label="Cadaster parcel map">
        <div id="map" role="application" aria-label="Satellite map with cadaster field overlays"></div>
      </section>

      <aside>
        <div class="panel">
          <div class="field-list" id="fieldList"></div>
        </div>
        <div class="panel add-field-panel">
          <div class="paste-coordinate-form">
            <textarea class="coord-paste-box" id="coordCsvText" aria-label="Paste coordinates CSV to add a field" spellcheck="false" placeholder="Paste coordinates CSV here to add a field.&#10;&#10;Nr.,x,y,IE&#10;1,470428.416,557958.594,15573&#10;2,470361.417,557858.697,15573&#10;3,470363.866,557856.637,15573"></textarea>
            <div class="paste-actions">
              <button class="add-coords-button" id="addCoordsButton" type="button" disabled>Add Field</button>
              <button class="copy-prompt" id="copyPrompt" type="button">Copy Extract Prompt</button>
              <span class="status coord-paste-status" id="coordPasteStatus" aria-live="polite"></span>
            </div>
          </div>
          <textarea class="prompt-box" id="csvPrompt" readonly spellcheck="false">Extract cadastral coordinate points from the attached image(s) and output one valid CSV only.

The table may be split across multiple images, pages, or side-by-side partial tables. Read all visible table fragments and merge them into one ordered point list.

Target CSV format:
Nr.,x,y,IE

Rules:
- Output only CSV text. Do not add explanations, markdown, code fences, notes, or comments.
- Use exactly this header: Nr.,x,y,IE
- Each row must contain one unique cadastral point.
- The point number comes from the "Punct inceput" column when available.
- The coordinate pair comes from the X / Y column next to that "Punct inceput".
- Ignore "Punct sfarsit" coordinate pairs if they duplicate the next row's start point.
- Use "Punct sfarsit" only to recover a missing final point if that point is not otherwise listed as a start point.
- Ignore the "Lungime segment" column.
- Preserve the original point order by point number.
- Convert Romanian/European coordinate formatting to plain numeric CSV:
  - Remove thousands separators.
  - Convert decimal comma to decimal point.
  - Example: 470.428,416 becomes 470428.416
  - Example: 557.958,594 becomes 557958.594
- If a coordinate wraps onto two lines, join the lines before conversion.
- If the table is split into multiple side-by-side blocks, continue reading left to right, top to bottom, unless point numbers show a different order.
- If multiple images/pages are provided, combine all fragments using the point numbers.
- Do not duplicate points that appear in overlapping fragments.
- The IE value is the cadastral/imobil number shown in the page title, such as "imobilul nr. 15573". Use that value for every row.
- If no IE number is visible, use UNKNOWN as the IE value.
- If a digit is unclear, infer it only when the neighboring segment rows confirm the same coordinate. Otherwise write [UNCLEAR] in that cell.

Before producing the final CSV, internally verify:
- Point numbers are consecutive where possible.
- The end point of each segment matches the next start point.
- The final segment may end at point 1, which closes the polygon.
- No duplicate Nr. rows remain.

Return only the CSV.</textarea>
        </div>
      </aside>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/proj4@2.12.1/dist/proj4.js"></script>
  <script>
    const fieldColors = ["#0f766e", "#b91c1c", "#1d4ed8", "#a16207", "#7c3aed", "#15803d", "#be185d", "#0369a1"];
    const crsDefinitions = {
      "EPSG:31700": "+proj=sterea +lat_0=46 +lon_0=25 +k=0.99975 +x_0=500000 +y_0=500000 +ellps=krass +towgs84=28,-121,-77,0,0,0,0 +units=m +no_defs +type=crs",
      "EPSG:3844": "+proj=sterea +lat_0=46 +lon_0=25 +k=0.99975 +x_0=500000 +y_0=500000 +ellps=krass +towgs84=2.329,-147.042,-92.08,0.309,-0.325,-0.497,5.69 +units=m +no_defs +type=crs"
    };
    const fields = [];
    let map = null;
    let satelliteLayer = null;
    let fieldLayerRoot = null;

    const fieldList = document.getElementById("fieldList");
    const csvInput = document.getElementById("csvInput");
    const coordCsvText = document.getElementById("coordCsvText");
    const addCoordsButton = document.getElementById("addCoordsButton");
    const coordPasteStatus = document.getElementById("coordPasteStatus");
    const csvPrompt = document.getElementById("csvPrompt");
    const copyPrompt = document.getElementById("copyPrompt");
    const satelliteToggle = document.getElementById("satelliteToggle");
    const crsSelect = document.getElementById("crsSelect");
    const POINT_DETAIL_MIN_ZOOM = 18;
    const FIT_BOUNDS_PADDING = [38, 38];
    const FIT_BOUNDS_MAX_ZOOM = 19;
    let parsedPasteFields = [];
    let copyPromptResetTimer = null;

    function formatNumber(value, digits = 3) {
      return new Intl.NumberFormat("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(value);
    }

    function formatCadasterCoord(value) {
      return new Intl.NumberFormat("ro-RO", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      }).format(value);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function areaSquareMeters(vertices) {
      let twiceArea = 0;
      vertices.forEach((point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        twiceArea += point.x * next.y - next.x * point.y;
      });
      return Math.abs(twiceArea) / 2;
    }

    function perimeterMeters(vertices) {
      return vertices.reduce((total, point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        return total + Math.hypot(next.x - point.x, next.y - point.y);
      }, 0);
    }

    function centroid(vertices) {
      let signedArea = 0;
      let cx = 0;
      let cy = 0;
      vertices.forEach((point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        const cross = point.x * next.y - next.x * point.y;
        signedArea += cross;
        cx += (point.x + next.x) * cross;
        cy += (point.y + next.y) * cross;
      });
      signedArea *= 0.5;
      return {
        x: cx / (6 * signedArea),
        y: cy / (6 * signedArea)
      };
    }

    function convertPoint(point) {
      const [lng, lat] = proj4(crsSelect.value, "EPSG:4326", [point.x, point.y]);
      return { ...point, lat, lng };
    }

    function visibleFields() {
      return fields.filter((field) => field.visible);
    }

    function uniqueFieldId(baseId) {
      const cleanBase = String(baseId || "field").trim() || "field";
      let id = cleanBase;
      let suffix = 2;

      while (fields.some((field) => field.id === id)) {
        id = `${cleanBase}-${suffix}`;
        suffix += 1;
      }

      return id;
    }

    function addField(fieldId, vertices, options = {}) {
      const id = uniqueFieldId(fieldId);
      fields.push({
        id,
        name: options.name || `Field ${id}`,
        color: fieldColors[fields.length % fieldColors.length],
        points: vertices,
        visible: options.visible ?? true,
        removable: options.removable ?? true
      });
    }

    function overlayStyleForZoom(zoom) {
      const currentZoom = Number.isFinite(zoom) ? zoom : 0;

      if (currentZoom >= POINT_DETAIL_MIN_ZOOM) {
        return {
          showPointDetails: true,
          showFieldName: true,
          pointRadius: 5,
          pointWeight: 2,
          perimeterWeight: 4
        };
      }

      if (currentZoom >= 16) {
        return {
          showPointDetails: false,
          showFieldName: false,
          pointRadius: 0,
          pointWeight: 0,
          perimeterWeight: 2
        };
      }

      return {
        showPointDetails: false,
        showFieldName: false,
        pointRadius: 0,
        pointWeight: 0,
        perimeterWeight: 1
      };
    }

    function setupMap() {
      if (!window.L || !window.proj4) {
        document.getElementById("map").textContent = "The satellite map needs Leaflet and Proj4 to load from the internet.";
        return false;
      }

      Object.entries(crsDefinitions).forEach(([code, definition]) => {
        proj4.defs(code, definition);
      });

      map = L.map("map", {
        preferCanvas: true,
        zoomControl: true
      });
      map.setView([46, 25], 7);

      satelliteLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 20,
          maxNativeZoom: 18,
          attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community"
        }
      );
      setSatelliteVisible(satelliteToggle.checked);

      fieldLayerRoot = L.layerGroup().addTo(map);
      map.on("zoomend", () => redrawMap());
      return true;
    }

    function setSatelliteVisible(visible) {
      if (!map || !satelliteLayer) {
        return;
      }

      satelliteToggle.setAttribute("aria-checked", String(visible));

      if (visible) {
        if (!map.hasLayer(satelliteLayer)) {
          satelliteLayer.addTo(map);
        }
        return;
      }

      if (map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
      }
    }

    function createFieldLayer(field, zoom = map.getZoom()) {
      const overlayStyle = overlayStyleForZoom(zoom);
      const geoPoints = field.points.map(convertPoint);
      const layer = L.layerGroup();
      const polygonLatLngs = geoPoints.map((point) => [point.lat, point.lng]);
      const parcelLayer = L.polygon(polygonLatLngs, {
        color: "#f8fafc",
        fillColor: field.color,
        fillOpacity: 0.22,
        opacity: 0.98,
        weight: overlayStyle.perimeterWeight
      }).addTo(layer);

      const center = centroid(field.points);
      if (overlayStyle.showFieldName && Number.isFinite(center.x) && Number.isFinite(center.y)) {
        const [centerLng, centerLat] = proj4(crsSelect.value, "EPSG:4326", [center.x, center.y]);
        L.marker([centerLat, centerLng], {
          interactive: false,
          icon: L.divIcon({
            className: "parcel-name",
            html: escapeHtml(field.id),
            iconSize: [90, 24],
            iconAnchor: [45, 12]
          })
        }).addTo(layer);
      }

      if (overlayStyle.showPointDetails) {
        geoPoints.forEach((point) => {
          const tooltipHtml = `
            <strong>Field ${escapeHtml(field.id)}, Point ${escapeHtml(point.id)}</strong>
            X: ${formatCadasterCoord(point.x)}<br>
            Y: ${formatCadasterCoord(point.y)}<br>
            Lat: ${point.lat.toFixed(7)}<br>
            Lng: ${point.lng.toFixed(7)}
          `;

          L.circleMarker([point.lat, point.lng], {
            radius: overlayStyle.pointRadius,
            color: "#0f172a",
            fillColor: "#ffffff",
            fillOpacity: 0.95,
            weight: overlayStyle.pointWeight
          })
            .bindTooltip(tooltipHtml, {
              className: "point-tooltip",
              direction: "top",
              opacity: 1,
              sticky: true
            })
            .addTo(layer);

          L.marker([point.lat, point.lng], {
            interactive: false,
            icon: L.divIcon({
              className: "point-label",
              html: escapeHtml(point.id),
              iconSize: [28, 18],
              iconAnchor: [-7, 14]
            })
          }).addTo(layer);
        });
      }

      return { group: layer, bounds: parcelLayer.getBounds() };
    }

    function redrawMap(options = {}) {
      if (!map || !fieldLayerRoot) {
        return;
      }

      const shouldFitBounds = Boolean(options.fitBounds);
      const currentZoom = map.getZoom();
      fieldLayerRoot.clearLayers();
      const bounds = L.latLngBounds();
      let layerZoom = currentZoom;

      visibleFields().forEach((field) => {
        const layer = createFieldLayer(field, layerZoom);
        layer.group.addTo(fieldLayerRoot);
        bounds.extend(layer.bounds);
      });

      if (shouldFitBounds && bounds.isValid()) {
        const targetZoom = Math.min(
          map.getBoundsZoom(bounds, false, L.point(FIT_BOUNDS_PADDING[0], FIT_BOUNDS_PADDING[1])),
          FIT_BOUNDS_MAX_ZOOM
        );

        if (targetZoom !== layerZoom) {
          layerZoom = targetZoom;
          fieldLayerRoot.clearLayers();
          visibleFields().forEach((field) => {
            const layer = createFieldLayer(field, layerZoom);
            layer.group.addTo(fieldLayerRoot);
          });
        }

        map.fitBounds(bounds, {
          padding: FIT_BOUNDS_PADDING,
          maxZoom: FIT_BOUNDS_MAX_ZOOM
        });
      }
    }

    function renderFieldList() {
      if (!fields.length) {
        fieldList.innerHTML = `
          <div class="field-empty" role="status">
            <strong>No fields loaded</strong>
            Import a CSV or paste coordinates below to add a field.
          </div>
        `;
        return;
      }

      fieldList.innerHTML = fields.map((field, index) => `
        <div class="field-item" style="--field-color: ${field.color}">
          <input id="fieldToggle${index}" type="checkbox" data-field-index="${index}" ${field.visible ? "checked" : ""}>
          <span class="field-swatch" aria-hidden="true"></span>
          <label class="field-meta" for="fieldToggle${index}">
            <span class="field-name">${escapeHtml(field.name)}</span>
            <span class="field-detail">${field.points.length} points · ${formatNumber(areaSquareMeters(field.points), 2)} m²</span>
          </label>
          ${field.removable ? `<button class="field-remove" type="button" data-remove-index="${index}" aria-label="Remove ${escapeHtml(field.name)}">×</button>` : ""}
        </div>
      `).join("");
    }

    function updateStats() {
      const selectedFields = visibleFields();
      const area = selectedFields.reduce((total, field) => total + areaSquareMeters(field.points), 0);
      const perimeter = selectedFields.reduce((total, field) => total + perimeterMeters(field.points), 0);

      document.getElementById("areaValue").textContent = selectedFields.length ? `${formatNumber(area)} m²` : "-";
      document.getElementById("perimeterValue").textContent = selectedFields.length ? `${formatNumber(perimeter)} m` : "-";
      document.getElementById("fieldCount").textContent = selectedFields.length ? String(selectedFields.length) : "-";
    }

    function render() {
      renderFieldList();
      redrawMap({ fitBounds: true });
      updateStats();
    }

    function parseCsvLine(line) {
      const cells = [];
      let value = "";
      let quoted = false;

      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        const next = line[index + 1];

        if (char === "\"" && quoted && next === "\"") {
          value += char;
          index += 1;
        } else if (char === "\"") {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          cells.push(value.trim());
          value = "";
        } else {
          value += char;
        }
      }

      cells.push(value.trim());
      return cells;
    }

    function parseCsvFields(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      if (lines.length < 2) {
        throw new Error("The CSV does not contain any coordinate rows.");
      }

      const headers = parseCsvLine(lines[0]).map((header) => header.toLowerCase().replace(/\.$/, ""));
      const nrIndex = headers.indexOf("nr");
      const xIndex = headers.indexOf("x");
      const yIndex = headers.indexOf("y");
      const ieIndex = headers.indexOf("ie");

      if ([nrIndex, xIndex, yIndex, ieIndex].includes(-1)) {
        throw new Error("Expected CSV headers: Nr., x, y, IE.");
      }

      const byField = new Map();

      lines.slice(1).forEach((line, rowIndex) => {
        const cells = parseCsvLine(line);
        const fieldId = cells[ieIndex];
        const pointId = cells[nrIndex];
        const x = Number(cells[xIndex]);
        const y = Number(cells[yIndex]);

        if (!fieldId || !Number.isFinite(x) || !Number.isFinite(y)) {
          throw new Error(`Invalid coordinate data on row ${rowIndex + 2}.`);
        }

        if (!byField.has(fieldId)) {
          byField.set(fieldId, []);
        }

        byField.get(fieldId).push({
          id: pointId || byField.get(fieldId).length + 1,
          x,
          y
        });
      });

      return [...byField.entries()].map(([id, vertices]) => {
        if (vertices.length < 3) {
          throw new Error(`Field ${id} needs at least 3 points.`);
        }

        return { id, points: vertices };
      });
    }

    function importFields(importedFields) {
      importedFields.forEach((field) => addField(field.id, field.points));
      render();
    }

    function setCoordPasteStatus(message, state = "") {
      coordPasteStatus.textContent = message;
      coordPasteStatus.dataset.state = state;
    }

    function validateCoordPaste() {
      const csvText = coordCsvText.value.trim();
      parsedPasteFields = [];
      addCoordsButton.disabled = true;

      if (!csvText) {
        setCoordPasteStatus("");
        return;
      }

      try {
        parsedPasteFields = parseCsvFields(csvText);
        addCoordsButton.disabled = false;
        setCoordPasteStatus(`Ready to add ${parsedPasteFields.length} field${parsedPasteFields.length === 1 ? "" : "s"}.`);
      } catch (error) {
        setCoordPasteStatus(error.message, "error");
      }
    }

    fieldList.addEventListener("change", (event) => {
      const index = Number(event.target.dataset.fieldIndex);
      if (!Number.isInteger(index)) {
        return;
      }

      fields[index].visible = event.target.checked;
      render();
    });

    fieldList.addEventListener("click", (event) => {
      const index = Number(event.target.dataset.removeIndex);
      if (!Number.isInteger(index)) {
        return;
      }

      fields.splice(index, 1);
      render();
    });

    csvInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) {
        return;
      }

      try {
        const importedFields = parseCsvFields(await file.text());
        importFields(importedFields);
        csvInput.value = "";
      } catch (error) {
        window.alert(error.message);
      }
    });

    coordCsvText.addEventListener("input", validateCoordPaste);

    addCoordsButton.addEventListener("click", () => {
      try {
        const importedFields = parsedPasteFields.length ? parsedPasteFields : parseCsvFields(coordCsvText.value.trim());
        importFields(importedFields);
        coordCsvText.value = "";
        parsedPasteFields = [];
        addCoordsButton.disabled = true;
        setCoordPasteStatus(`Added ${importedFields.length} field${importedFields.length === 1 ? "" : "s"}.`);
      } catch (error) {
        setCoordPasteStatus(error.message, "error");
        parsedPasteFields = [];
        addCoordsButton.disabled = true;
      }
    });

    function showCopyPromptResult(message) {
      copyPrompt.textContent = message;
      window.clearTimeout(copyPromptResetTimer);
      copyPromptResetTimer = window.setTimeout(() => {
        copyPrompt.textContent = "Copy Extract Prompt";
      }, 1600);
    }

    copyPrompt.addEventListener("click", async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(csvPrompt.value);
        } else {
          csvPrompt.select();
          document.execCommand("copy");
          csvPrompt.setSelectionRange(0, 0);
        }

        showCopyPromptResult("Prompt Copied");
      } catch (error) {
        showCopyPromptResult("Copy Failed");
      }
    });

    satelliteToggle.addEventListener("change", () => {
      setSatelliteVisible(satelliteToggle.checked);
    });

    crsSelect.addEventListener("change", () => {
      render();
    });

    if (setupMap()) {
      render();
    } else {
      renderFieldList();
      updateStats();
    }
  </script>
</body>
</html>
