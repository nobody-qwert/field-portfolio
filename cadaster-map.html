<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadaster Fields Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ4NJPaUu9ONlSNXQIFJx6T1xqmDkCk="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #617080;
      --line: #d4dbe3;
      --parcel: #111827;
      --point: #f7f9fc;
      --point-stroke: #0f172a;
      --accent: #0f766e;
      --accent-soft: #d9f3ee;
      --surface: #ffffff;
      --page: #eef2f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title-tools {
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      gap: 20px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      min-width: 0;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .stat {
      display: grid;
      gap: 3px;
      min-width: 132px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 0;
    }

    .map-wrap {
      position: relative;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
    }

    #map {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      height: calc(100vh - 95px);
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #d9e2ea;
      box-shadow: 0 14px 34px rgb(15 23 42 / 0.08);
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      outline-offset: 1px;
      touch-action: pan-x pan-y;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      visibility: hidden;
    }

    .leaflet-tile-loaded {
      visibility: inherit;
    }

    .leaflet-pane {
      z-index: 400;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-shadow-pane {
      z-index: 500;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-popup-pane {
      z-index: 700;
    }

    .leaflet-map-pane svg {
      z-index: 200;
    }

    .leaflet-map-pane canvas {
      z-index: 100;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      clear: both;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-bottom {
      bottom: 0;
    }

    .leaflet-left {
      left: 0;
    }

    .leaflet-left .leaflet-control {
      float: left;
      margin-left: 10px;
    }

    .leaflet-right .leaflet-control {
      float: right;
      margin-right: 10px;
    }

    .leaflet-top .leaflet-control {
      margin-top: 10px;
    }

    .leaflet-bottom .leaflet-control {
      margin-bottom: 10px;
    }

    .leaflet-control-zoom a {
      display: block;
      width: 30px;
      height: 30px;
      border-bottom: 1px solid #c8d0d8;
      color: #111827;
      background: #fff;
      font: bold 18px/30px Arial, Helvetica, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 4px 4px 0 0;
    }

    .leaflet-control-zoom a:last-child {
      border-bottom: 0;
      border-radius: 0 0 4px 4px;
    }

    .leaflet-interactive {
      cursor: pointer;
    }

    .leaflet-tooltip {
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
    }

    .point-label {
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      text-shadow:
        -1px -1px 0 #fff,
        1px -1px 0 #fff,
        -1px 1px 0 #fff,
        1px 1px 0 #fff;
    }

    .parcel-name {
      color: rgb(255 255 255 / 0.92);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 5px rgb(0 0 0 / 0.85);
    }

    .leaflet-tooltip.point-tooltip {
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 12px 24px rgb(15 23 42 / 0.16);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.4;
      padding: 8px 10px;
    }

    .leaflet-tooltip.point-tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    aside {
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--surface);
    }

    .panel {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.25;
    }

    .import-row {
      display: grid;
      gap: 8px;
    }

    .file-input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
    }

    .file-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .header-file-input {
      width: 240px;
      padding: 5px 7px;
      font-size: 12px;
    }

    .hint,
    .status {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status {
      min-height: 18px;
      color: var(--accent);
    }

    .import-status {
      max-width: 280px;
      min-height: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .header-setting {
      justify-content: flex-start;
      padding-left: 2px;
      white-space: nowrap;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-slider {
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #cbd5e1;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .switch-slider::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 3px rgb(15 23 42 / 0.2);
      content: "";
      transition: transform 160ms ease;
    }

    .switch input:checked + .switch-slider {
      border-color: var(--accent);
      background: var(--accent);
    }

    .switch input:checked + .switch-slider::before {
      transform: translateX(18px);
    }

    .switch input:focus-visible + .switch-slider {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .field-list {
      display: grid;
      gap: 8px;
    }

    .field-item {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .field-item input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .field-swatch {
      width: 10px;
      height: 28px;
      border-radius: 999px;
      background: var(--field-color);
    }

    .field-meta {
      display: grid;
      gap: 2px;
      min-width: 0;
      cursor: pointer;
    }

    .field-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-detail {
      color: var(--muted);
      font-size: 12px;
    }

    .field-remove {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .field-remove:hover {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fff5f5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      padding: 6px 5px;
      border-bottom: 1px solid #edf1f5;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: var(--surface);
      font-weight: 700;
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      display: none;
      min-width: 176px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 12px 24px rgb(15 23 42 / 0.16);
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .title-tools {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }

      .header-controls {
        width: 100%;
      }

      .header-file-input {
        width: min(240px, 100%);
      }

      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      #map {
        height: 62vh;
        min-height: 420px;
      }

      .stats {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-tools">
        <h1>Cadaster Field Geometry</h1>
        <div class="header-controls">
          <label class="file-control">
            <span>Import CSV</span>
            <input class="file-input header-file-input" id="csvInput" type="file" accept=".csv,text/csv">
          </label>
          <span class="status import-status" id="importStatus" aria-live="polite"></span>
          <label class="setting-row header-setting">
            <span>Satellite view</span>
            <span class="switch">
              <input id="satelliteToggle" type="checkbox" role="switch" aria-checked="true" checked>
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>
        </div>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat">
          <span>Area</span>
          <strong id="areaValue">-</strong>
        </div>
        <div class="stat">
          <span>Perimeter</span>
          <strong id="perimeterValue">-</strong>
        </div>
        <div class="stat">
          <span>Points</span>
          <strong id="pointCount">-</strong>
        </div>
        <div class="stat">
          <span>Visible Fields</span>
          <strong id="fieldCount">-</strong>
        </div>
      </div>
    </header>

    <div class="layout">
      <section class="map-wrap" aria-label="Cadaster parcel map">
        <div id="map" role="application" aria-label="Satellite map with cadaster field overlays"></div>
      </section>

      <aside>
        <div class="panel">
          <h2>Visible Fields</h2>
          <div class="field-list" id="fieldList"></div>
        </div>
        <div class="panel">
          <h2>Point Coordinates</h2>
          <table>
            <thead>
              <tr>
                <th>Field</th>
                <th>Point</th>
                <th>X</th>
                <th>Y</th>
              </tr>
            </thead>
            <tbody id="pointsTable"></tbody>
          </table>
        </div>
      </aside>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/proj4@2.12.1/dist/proj4.js"></script>
  <script>
    const initialPoints = [
      { id: 1, x: 471485.902, y: 556443.344 },
      { id: 2, x: 471473.137, y: 556355.069 },
      { id: 3, x: 471509.293, y: 556347.704 },
      { id: 4, x: 471528.543, y: 556344.055 },
      { id: 5, x: 471536.354, y: 556342.945 },
      { id: 6, x: 471544.293, y: 556341.878 },
      { id: 7, x: 471552.958, y: 556342.049 },
      { id: 8, x: 471563.543, y: 556343.073 },
      { id: 9, x: 471573.107, y: 556344.208 },
      { id: 10, x: 471575.601, y: 556345.570 },
      { id: 11, x: 471577.778, y: 556348.088 },
      { id: 12, x: 471578.973, y: 556351.332 },
      { id: 13, x: 471579.357, y: 556356.198 },
      { id: 14, x: 471579.272, y: 556360.381 },
      { id: 15, x: 471579.485, y: 556365.588 },
      { id: 16, x: 471579.827, y: 556370.070 },
      { id: 17, x: 471580.552, y: 556373.655 },
      { id: 18, x: 471581.620, y: 556377.070 },
      { id: 19, x: 471583.028, y: 556379.503 },
      { id: 20, x: 471585.077, y: 556382.107 },
      { id: 21, x: 471587.296, y: 556384.113 },
      { id: 22, x: 471589.281, y: 556385.223 },
      { id: 23, x: 471590.924, y: 556385.799 },
      { id: 24, x: 471592.717, y: 556385.735 },
      { id: 25, x: 471594.809, y: 556385.180 },
      { id: 26, x: 471596.644, y: 556384.027 },
      { id: 27, x: 471598.821, y: 556383.174 },
      { id: 28, x: 471600.955, y: 556382.918 },
      { id: 29, x: 471603.548, y: 556383.024 },
      { id: 30, x: 471633.169, y: 556389.473 },
      { id: 31, x: 471693.620, y: 556404.643 },
      { id: 32, x: 471694.143, y: 556409.356 },
      { id: 33, x: 471694.266, y: 556410.465 },
      { id: 34, x: 471671.382, y: 556410.918 },
      { id: 35, x: 471649.913, y: 556412.796 },
      { id: 36, x: 471629.254, y: 556415.442 },
      { id: 37, x: 471596.473, y: 556421.418 },
      { id: 38, x: 471556.479, y: 556429.015 },
      { id: 39, x: 471527.753, y: 556434.394 },
      { id: 40, x: 471506.113, y: 556438.363 }
    ];

    const fieldColors = ["#0f766e", "#b91c1c", "#1d4ed8", "#a16207", "#7c3aed", "#15803d", "#be185d", "#0369a1"];
    const fields = [];
    let map = null;
    let satelliteLayer = null;
    let fieldLayerRoot = null;

    const tableBody = document.getElementById("pointsTable");
    const fieldList = document.getElementById("fieldList");
    const importStatus = document.getElementById("importStatus");
    const csvInput = document.getElementById("csvInput");
    const satelliteToggle = document.getElementById("satelliteToggle");

    function formatNumber(value, digits = 3) {
      return new Intl.NumberFormat("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(value);
    }

    function formatCadasterCoord(value) {
      return new Intl.NumberFormat("ro-RO", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      }).format(value);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function areaSquareMeters(vertices) {
      let twiceArea = 0;
      vertices.forEach((point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        twiceArea += point.x * next.y - next.x * point.y;
      });
      return Math.abs(twiceArea) / 2;
    }

    function perimeterMeters(vertices) {
      return vertices.reduce((total, point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        return total + Math.hypot(next.x - point.x, next.y - point.y);
      }, 0);
    }

    function centroid(vertices) {
      let signedArea = 0;
      let cx = 0;
      let cy = 0;
      vertices.forEach((point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        const cross = point.x * next.y - next.x * point.y;
        signedArea += cross;
        cx += (point.x + next.x) * cross;
        cy += (point.y + next.y) * cross;
      });
      signedArea *= 0.5;
      return {
        x: cx / (6 * signedArea),
        y: cy / (6 * signedArea)
      };
    }

    function convertPoint(point) {
      const [lng, lat] = proj4("EPSG:3844", "EPSG:4326", [point.x, point.y]);
      return { ...point, lat, lng };
    }

    function visibleFields() {
      return fields.filter((field) => field.visible);
    }

    function uniqueFieldId(baseId) {
      const cleanBase = String(baseId || "field").trim() || "field";
      let id = cleanBase;
      let suffix = 2;

      while (fields.some((field) => field.id === id)) {
        id = `${cleanBase}-${suffix}`;
        suffix += 1;
      }

      return id;
    }

    function addField(fieldId, vertices, options = {}) {
      const id = uniqueFieldId(fieldId);
      fields.push({
        id,
        name: options.name || `Field ${id}`,
        color: fieldColors[fields.length % fieldColors.length],
        points: vertices,
        visible: options.visible ?? true,
        removable: options.removable ?? true
      });
    }

    function setupMap() {
      if (!window.L || !window.proj4) {
        document.getElementById("map").textContent = "The satellite map needs Leaflet and Proj4 to load from the internet.";
        return false;
      }

      proj4.defs(
        "EPSG:3844",
        "+proj=sterea +lat_0=46 +lon_0=25 +k=0.99975 +x_0=500000 +y_0=500000 +ellps=krass +towgs84=2.329,-147.042,-92.08,0.309,-0.325,-0.497,5.69 +units=m +no_defs +type=crs"
      );

      map = L.map("map", {
        preferCanvas: true,
        zoomControl: true
      });

      satelliteLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 20,
          attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community"
        }
      );
      setSatelliteVisible(satelliteToggle.checked);

      fieldLayerRoot = L.layerGroup().addTo(map);
      return true;
    }

    function setSatelliteVisible(visible) {
      if (!map || !satelliteLayer) {
        return;
      }

      satelliteToggle.setAttribute("aria-checked", String(visible));

      if (visible) {
        if (!map.hasLayer(satelliteLayer)) {
          satelliteLayer.addTo(map);
        }
        return;
      }

      if (map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
      }
    }

    function createFieldLayer(field) {
      const geoPoints = field.points.map(convertPoint);
      const layer = L.layerGroup();
      const polygonLatLngs = geoPoints.map((point) => [point.lat, point.lng]);
      const parcelLayer = L.polygon(polygonLatLngs, {
        color: "#0b1220",
        fillColor: field.color,
        fillOpacity: 0.22,
        opacity: 0.95,
        weight: 3
      }).addTo(layer);

      const center = centroid(field.points);
      if (Number.isFinite(center.x) && Number.isFinite(center.y)) {
        const [centerLng, centerLat] = proj4("EPSG:3844", "EPSG:4326", [center.x, center.y]);
        L.marker([centerLat, centerLng], {
          interactive: false,
          icon: L.divIcon({
            className: "parcel-name",
            html: escapeHtml(field.id),
            iconSize: [90, 24],
            iconAnchor: [45, 12]
          })
        }).addTo(layer);
      }

      geoPoints.forEach((point) => {
        const tooltipHtml = `
          <strong>Field ${escapeHtml(field.id)}, Point ${escapeHtml(point.id)}</strong>
          X: ${formatCadasterCoord(point.x)}<br>
          Y: ${formatCadasterCoord(point.y)}<br>
          Lat: ${point.lat.toFixed(7)}<br>
          Lng: ${point.lng.toFixed(7)}
        `;

        L.circleMarker([point.lat, point.lng], {
          radius: 5,
          color: "#0f172a",
          fillColor: "#ffffff",
          fillOpacity: 0.95,
          weight: 2
        })
          .bindTooltip(tooltipHtml, {
            className: "point-tooltip",
            direction: "top",
            opacity: 1,
            sticky: true
          })
          .addTo(layer);

        L.marker([point.lat, point.lng], {
          interactive: false,
          icon: L.divIcon({
            className: "point-label",
            html: escapeHtml(point.id),
            iconSize: [28, 18],
            iconAnchor: [-7, 14]
          })
        }).addTo(layer);
      });

      return { group: layer, bounds: parcelLayer.getBounds() };
    }

    function redrawMap() {
      if (!map || !fieldLayerRoot) {
        return;
      }

      fieldLayerRoot.clearLayers();
      const bounds = L.latLngBounds();

      visibleFields().forEach((field) => {
        const layer = createFieldLayer(field);
        layer.group.addTo(fieldLayerRoot);
        bounds.extend(layer.bounds);
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, {
          padding: [38, 38],
          maxZoom: 19
        });
      }
    }

    function renderFieldList() {
      fieldList.innerHTML = fields.map((field, index) => `
        <div class="field-item" style="--field-color: ${field.color}">
          <input id="fieldToggle${index}" type="checkbox" data-field-index="${index}" ${field.visible ? "checked" : ""}>
          <span class="field-swatch" aria-hidden="true"></span>
          <label class="field-meta" for="fieldToggle${index}">
            <span class="field-name">${escapeHtml(field.name)}</span>
            <span class="field-detail">${field.points.length} points · ${formatNumber(areaSquareMeters(field.points), 2)} m²</span>
          </label>
          ${field.removable ? `<button class="field-remove" type="button" data-remove-index="${index}" aria-label="Remove ${escapeHtml(field.name)}">×</button>` : ""}
        </div>
      `).join("");
    }

    function fillTable() {
      const rows = visibleFields().flatMap((field) => field.points.map((point) => `
        <tr>
          <td>${escapeHtml(field.id)}</td>
          <td>${escapeHtml(point.id)}</td>
          <td>${formatCadasterCoord(point.x)}</td>
          <td>${formatCadasterCoord(point.y)}</td>
        </tr>
      `));
      tableBody.innerHTML = rows.join("");
    }

    function updateStats() {
      const selectedFields = visibleFields();
      const area = selectedFields.reduce((total, field) => total + areaSquareMeters(field.points), 0);
      const perimeter = selectedFields.reduce((total, field) => total + perimeterMeters(field.points), 0);
      const pointCount = selectedFields.reduce((total, field) => total + field.points.length, 0);

      document.getElementById("areaValue").textContent = `${formatNumber(area)} m²`;
      document.getElementById("perimeterValue").textContent = `${formatNumber(perimeter)} m`;
      document.getElementById("pointCount").textContent = String(pointCount);
      document.getElementById("fieldCount").textContent = String(selectedFields.length);
    }

    function render() {
      renderFieldList();
      redrawMap();
      fillTable();
      updateStats();
    }

    function parseCsvLine(line) {
      const cells = [];
      let value = "";
      let quoted = false;

      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        const next = line[index + 1];

        if (char === "\"" && quoted && next === "\"") {
          value += char;
          index += 1;
        } else if (char === "\"") {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          cells.push(value.trim());
          value = "";
        } else {
          value += char;
        }
      }

      cells.push(value.trim());
      return cells;
    }

    function parseCsvFields(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      if (lines.length < 2) {
        throw new Error("The CSV does not contain any coordinate rows.");
      }

      const headers = parseCsvLine(lines[0]).map((header) => header.toLowerCase().replace(/\.$/, ""));
      const nrIndex = headers.indexOf("nr");
      const xIndex = headers.indexOf("x");
      const yIndex = headers.indexOf("y");
      const ieIndex = headers.indexOf("ie");

      if ([nrIndex, xIndex, yIndex, ieIndex].includes(-1)) {
        throw new Error("Expected CSV headers: Nr., x, y, IE.");
      }

      const byField = new Map();

      lines.slice(1).forEach((line, rowIndex) => {
        const cells = parseCsvLine(line);
        const fieldId = cells[ieIndex];
        const pointId = cells[nrIndex];
        const x = Number(cells[xIndex]);
        const y = Number(cells[yIndex]);

        if (!fieldId || !Number.isFinite(x) || !Number.isFinite(y)) {
          throw new Error(`Invalid coordinate data on row ${rowIndex + 2}.`);
        }

        if (!byField.has(fieldId)) {
          byField.set(fieldId, []);
        }

        byField.get(fieldId).push({
          id: pointId || byField.get(fieldId).length + 1,
          x,
          y
        });
      });

      return [...byField.entries()].map(([id, vertices]) => {
        if (vertices.length < 3) {
          throw new Error(`Field ${id} needs at least 3 points.`);
        }

        return { id, points: vertices };
      });
    }

    fieldList.addEventListener("change", (event) => {
      const index = Number(event.target.dataset.fieldIndex);
      if (!Number.isInteger(index)) {
        return;
      }

      fields[index].visible = event.target.checked;
      render();
    });

    fieldList.addEventListener("click", (event) => {
      const index = Number(event.target.dataset.removeIndex);
      if (!Number.isInteger(index)) {
        return;
      }

      fields.splice(index, 1);
      render();
    });

    csvInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) {
        return;
      }

      try {
        const importedFields = parseCsvFields(await file.text());
        importedFields.forEach((field) => addField(field.id, field.points));
        importStatus.textContent = `Imported ${importedFields.length} field${importedFields.length === 1 ? "" : "s"} from ${file.name}.`;
        csvInput.value = "";
        render();
      } catch (error) {
        importStatus.textContent = error.message;
      }
    });

    satelliteToggle.addEventListener("change", () => {
      setSatelliteVisible(satelliteToggle.checked);
    });

    addField("12511", initialPoints, {
      name: "Field 12511",
      removable: false
    });

    if (setupMap()) {
      render();
    } else {
      renderFieldList();
      fillTable();
      updateStats();
    }
  </script>
</body>
</html>
