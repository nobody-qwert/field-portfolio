<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadaster Parcel 12511</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ4NJPaUu9ONlSNXQIFJx6T1xqmDkCk="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #617080;
      --line: #d4dbe3;
      --parcel: #111827;
      --point: #f7f9fc;
      --point-stroke: #0f172a;
      --accent: #0f766e;
      --accent-soft: #d9f3ee;
      --surface: #ffffff;
      --page: #eef2f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .stat {
      display: grid;
      gap: 3px;
      min-width: 132px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      min-height: 0;
    }

    .map-wrap {
      position: relative;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
    }

    #map {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      height: calc(100vh - 95px);
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #d9e2ea;
      box-shadow: 0 14px 34px rgb(15 23 42 / 0.08);
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      outline-offset: 1px;
      touch-action: pan-x pan-y;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      visibility: hidden;
    }

    .leaflet-tile-loaded {
      visibility: inherit;
    }

    .leaflet-pane {
      z-index: 400;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-shadow-pane {
      z-index: 500;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-popup-pane {
      z-index: 700;
    }

    .leaflet-map-pane svg {
      z-index: 200;
    }

    .leaflet-map-pane canvas {
      z-index: 100;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      clear: both;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-bottom {
      bottom: 0;
    }

    .leaflet-left {
      left: 0;
    }

    .leaflet-left .leaflet-control {
      float: left;
      margin-left: 10px;
    }

    .leaflet-right .leaflet-control {
      float: right;
      margin-right: 10px;
    }

    .leaflet-top .leaflet-control {
      margin-top: 10px;
    }

    .leaflet-bottom .leaflet-control {
      margin-bottom: 10px;
    }

    .leaflet-control-zoom a {
      display: block;
      width: 30px;
      height: 30px;
      border-bottom: 1px solid #c8d0d8;
      color: #111827;
      background: #fff;
      font: bold 18px/30px Arial, Helvetica, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 4px 4px 0 0;
    }

    .leaflet-control-zoom a:last-child {
      border-bottom: 0;
      border-radius: 0 0 4px 4px;
    }

    .leaflet-interactive {
      cursor: pointer;
    }

    .leaflet-tooltip {
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
    }

    .point-label {
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      text-shadow:
        -1px -1px 0 #fff,
        1px -1px 0 #fff,
        -1px 1px 0 #fff,
        1px 1px 0 #fff;
    }

    .parcel-name {
      color: rgb(255 255 255 / 0.92);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 5px rgb(0 0 0 / 0.85);
    }

    .leaflet-tooltip.point-tooltip {
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 12px 24px rgb(15 23 42 / 0.16);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.4;
      padding: 8px 10px;
    }

    .leaflet-tooltip.point-tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    aside {
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--surface);
    }

    .panel {
      padding: 16px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.25;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      padding: 6px 5px;
      border-bottom: 1px solid #edf1f5;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: var(--surface);
      font-weight: 700;
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      display: none;
      min-width: 176px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 12px 24px rgb(15 23 42 / 0.16);
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      #map {
        height: 62vh;
        min-height: 420px;
      }

      .stats {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Parcel 12511 Cadaster Geometry</h1>
      <div class="stats" aria-live="polite">
        <div class="stat">
          <span>Area</span>
          <strong id="areaValue">-</strong>
        </div>
        <div class="stat">
          <span>Perimeter</span>
          <strong id="perimeterValue">-</strong>
        </div>
        <div class="stat">
          <span>Points</span>
          <strong id="pointCount">-</strong>
        </div>
      </div>
    </header>

    <div class="layout">
      <section class="map-wrap" aria-label="Cadaster parcel map">
        <div id="map" role="application" aria-label="Satellite map with parcel 12511 overlay"></div>
      </section>

      <aside>
        <div class="panel">
          <h2>Point Coordinates</h2>
          <table>
            <thead>
              <tr>
                <th>Point</th>
                <th>X</th>
                <th>Y</th>
              </tr>
            </thead>
            <tbody id="pointsTable"></tbody>
          </table>
        </div>
      </aside>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/proj4@2.12.1/dist/proj4.js"></script>
  <script>
    const points = [
      { id: 1, x: 471485.902, y: 556443.344 },
      { id: 2, x: 471473.137, y: 556355.069 },
      { id: 3, x: 471509.293, y: 556347.704 },
      { id: 4, x: 471528.543, y: 556344.055 },
      { id: 5, x: 471536.354, y: 556342.945 },
      { id: 6, x: 471544.293, y: 556341.878 },
      { id: 7, x: 471552.958, y: 556342.049 },
      { id: 8, x: 471563.543, y: 556343.073 },
      { id: 9, x: 471573.107, y: 556344.208 },
      { id: 10, x: 471575.601, y: 556345.570 },
      { id: 11, x: 471577.778, y: 556348.088 },
      { id: 12, x: 471578.973, y: 556351.332 },
      { id: 13, x: 471579.357, y: 556356.198 },
      { id: 14, x: 471579.272, y: 556360.381 },
      { id: 15, x: 471579.485, y: 556365.588 },
      { id: 16, x: 471579.827, y: 556370.070 },
      { id: 17, x: 471580.552, y: 556373.655 },
      { id: 18, x: 471581.620, y: 556377.070 },
      { id: 19, x: 471583.028, y: 556379.503 },
      { id: 20, x: 471585.077, y: 556382.107 },
      { id: 21, x: 471587.296, y: 556384.113 },
      { id: 22, x: 471589.281, y: 556385.223 },
      { id: 23, x: 471590.924, y: 556385.799 },
      { id: 24, x: 471592.717, y: 556385.735 },
      { id: 25, x: 471594.809, y: 556385.180 },
      { id: 26, x: 471596.644, y: 556384.027 },
      { id: 27, x: 471598.821, y: 556383.174 },
      { id: 28, x: 471600.955, y: 556382.918 },
      { id: 29, x: 471603.548, y: 556383.024 },
      { id: 30, x: 471633.169, y: 556389.473 },
      { id: 31, x: 471693.620, y: 556404.643 },
      { id: 32, x: 471694.143, y: 556409.356 },
      { id: 33, x: 471694.266, y: 556410.465 },
      { id: 34, x: 471671.382, y: 556410.918 },
      { id: 35, x: 471649.913, y: 556412.796 },
      { id: 36, x: 471629.254, y: 556415.442 },
      { id: 37, x: 471596.473, y: 556421.418 },
      { id: 38, x: 471556.479, y: 556429.015 },
      { id: 39, x: 471527.753, y: 556434.394 },
      { id: 40, x: 471506.113, y: 556438.363 }
    ];

    const tableBody = document.getElementById("pointsTable");

    function formatNumber(value, digits = 3) {
      return new Intl.NumberFormat("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(value);
    }

    function formatCadasterCoord(value) {
      return new Intl.NumberFormat("ro-RO", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      }).format(value);
    }

    function areaSquareMeters(vertices) {
      let twiceArea = 0;
      vertices.forEach((point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        twiceArea += point.x * next.y - next.x * point.y;
      });
      return Math.abs(twiceArea) / 2;
    }

    function perimeterMeters(vertices) {
      return vertices.reduce((total, point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        return total + Math.hypot(next.x - point.x, next.y - point.y);
      }, 0);
    }

    function centroid(vertices) {
      let signedArea = 0;
      let cx = 0;
      let cy = 0;
      vertices.forEach((point, index) => {
        const next = vertices[(index + 1) % vertices.length];
        const cross = point.x * next.y - next.x * point.y;
        signedArea += cross;
        cx += (point.x + next.x) * cross;
        cy += (point.y + next.y) * cross;
      });
      signedArea *= 0.5;
      return {
        x: cx / (6 * signedArea),
        y: cy / (6 * signedArea)
      };
    }

    function drawMap() {
      if (!window.L || !window.proj4) {
        document.getElementById("map").textContent = "The satellite map needs Leaflet and Proj4 to load from the internet.";
        return;
      }

      proj4.defs(
        "EPSG:3844",
        "+proj=sterea +lat_0=46 +lon_0=25 +k=0.99975 +x_0=500000 +y_0=500000 +ellps=krass +towgs84=2.329,-147.042,-92.08,0.309,-0.325,-0.497,5.69 +units=m +no_defs +type=crs"
      );

      const geoPoints = points.map((point) => {
        const [lng, lat] = proj4("EPSG:3844", "EPSG:4326", [point.x, point.y]);
        return { ...point, lat, lng };
      });

      const map = L.map("map", {
        preferCanvas: true,
        zoomControl: true
      });

      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 20,
          attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community"
        }
      ).addTo(map);

      const polygonLatLngs = geoPoints.map((point) => [point.lat, point.lng]);
      const parcelLayer = L.polygon(polygonLatLngs, {
        color: "#0b1220",
        fillColor: "#0f766e",
        fillOpacity: 0.22,
        opacity: 0.95,
        weight: 3
      }).addTo(map);

      const center = centroid(points);
      const [centerLng, centerLat] = proj4("EPSG:3844", "EPSG:4326", [center.x, center.y]);
      L.marker([centerLat, centerLng], {
        interactive: false,
        icon: L.divIcon({
          className: "parcel-name",
          html: "12511",
          iconSize: [70, 24],
          iconAnchor: [35, 12]
        })
      }).addTo(map);

      geoPoints.forEach((point) => {
        const tooltipHtml = `
          <strong>Point ${point.id}</strong>
          X: ${formatCadasterCoord(point.x)}<br>
          Y: ${formatCadasterCoord(point.y)}<br>
          Lat: ${point.lat.toFixed(7)}<br>
          Lng: ${point.lng.toFixed(7)}
        `;

        L.circleMarker([point.lat, point.lng], {
          radius: 5,
          color: "#0f172a",
          fillColor: "#ffffff",
          fillOpacity: 0.95,
          weight: 2
        })
          .bindTooltip(tooltipHtml, {
            className: "point-tooltip",
            direction: "top",
            opacity: 1,
            sticky: true
          })
          .addTo(map);

        L.marker([point.lat, point.lng], {
          interactive: false,
          icon: L.divIcon({
            className: "point-label",
            html: point.id,
            iconSize: [28, 18],
            iconAnchor: [-7, 14]
          })
        }).addTo(map);
      });

      map.fitBounds(parcelLayer.getBounds(), {
        padding: [38, 38],
        maxZoom: 19
      });
    }

    function fillTable() {
      const rows = points.map((point) => `
        <tr>
          <td>${point.id}</td>
          <td>${formatCadasterCoord(point.x)}</td>
          <td>${formatCadasterCoord(point.y)}</td>
        </tr>
      `);
      tableBody.innerHTML = rows.join("");
    }

    document.getElementById("areaValue").textContent = `${formatNumber(areaSquareMeters(points))} m²`;
    document.getElementById("perimeterValue").textContent = `${formatNumber(perimeterMeters(points))} m`;
    document.getElementById("pointCount").textContent = String(points.length);

    drawMap();
    fillTable();
  </script>
</body>
</html>
